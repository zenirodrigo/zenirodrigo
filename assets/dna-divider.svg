<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="130" viewBox="0 0 1000 130" role="img" aria-labelledby="title description">
  <title id="title">Animated DNA double helix</title>
  <desc id="description">Animated DNA divider with pastel pink and pastel green colors.</desc>
  <defs>
    <linearGradient id="pinkGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7CADB"/>
      <stop offset="30%" stop-color="#F5D8E7"/>
      <stop offset="50%" stop-color="#F7F7F7"/>
      <stop offset="70%" stop-color="#D9F2D9"/>
      <stop offset="100%" stop-color="#BFECC8"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <path d="M20 65 C55 15 95 15 130 65 S205 115 240 65 S315 15 350 65 S425 115 460 65 S535 15 570 65 S645 115 680 65 S755 15 790 65 S865 115 900 65 S965 15 980 65" stroke="url(#pinkGreen)" stroke-width="5" stroke-dasharray="18 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-104" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M20 65 C55 115 95 115 130 65 S205 15 240 65 S315 115 350 65 S425 15 460 65 S535 115 570 65 S645 15 680 65 S755 115 790 65 S865 15 900 65 S965 115 980 65" stroke="url(#pinkGreen)" stroke-width="5" stroke-dasharray="18 8">
      <animate attributeName="stroke-dashoffset" from="-104" to="0" dur="4s" repeatCount="indefinite"/>
    </path>
    <g stroke="#A8B9AE" stroke-width="2.5" opacity="0.65">
      <line x1="48" y1="36" x2="48" y2="94"/><line x1="82" y1="27" x2="82" y2="103"/><line x1="116" y1="49" x2="116" y2="81"/>
      <line x1="158" y1="94" x2="158" y2="36"/><line x1="192" y1="103" x2="192" y2="27"/><line x1="226" y1="81" x2="226" y2="49"/>
      <line x1="268" y1="36" x2="268" y2="94"/><line x1="302" y1="27" x2="302" y2="103"/><line x1="336" y1="49" x2="336" y2="81"/>
      <line x1="378" y1="94" x2="378" y2="36"/><line x1="412" y1="103" x2="412" y2="27"/><line x1="446" y1="81" x2="446" y2="49"/>
      <line x1="488" y1="36" x2="488" y2="94"/><line x1="522" y1="27" x2="522" y2="103"/><line x1="556" y1="49" x2="556" y2="81"/>
      <line x1="598" y1="94" x2="598" y2="36"/><line x1="632" y1="103" x2="632" y2="27"/><line x1="666" y1="81" x2="666" y2="49"/>
      <line x1="708" y1="36" x2="708" y2="94"/><line x1="742" y1="27" x2="742" y2="103"/><line x1="776" y1="49" x2="776" y2="81"/>
      <line x1="818" y1="94" x2="818" y2="36"/><line x1="852" y1="103" x2="852" y2="27"/><line x1="886" y1="81" x2="886" y2="49"/>
      <line x1="928" y1="36" x2="928" y2="94"/><line x1="962" y1="29" x2="962" y2="101"/>
      <animate attributeName="opacity" values="0.35;0.8;0.35" dur="3s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
